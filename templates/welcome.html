<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Notes Management</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/welcome.css">
</head>
<body>
    <div class="page-shell">
        <div class="dashboard-box text-center">
            <h1>Welcome to ATM App</h1>
            <p>Please choose Register or Login to continue.</p>
            <div class="dashboard-buttons">
                <button type="button" class="btn btn-primary btn-lg w-100 mb-2" onclick="window.location.href='{{url_for('register')}}'">Register</button>
                <button type="button" class="btn btn-outline-primary btn-lg w-100" onclick="window.location.href='{{url_for('login')}}'">Login</button>
            </div>
        </div>
    </div>
</body>
</html>
